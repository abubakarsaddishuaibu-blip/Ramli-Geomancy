<body class="text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="w-full max-w-md min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#1F6B43] text-white px-4 py-3 shadow-md flex items-center justify-between">
    <button onclick="openDrawer()" aria-label="menu" class="w-11 h-11 rounded-xl hover:bg-[#175434] flex flex-col gap-1.5 items-center justify-center">
      <span class="w-6 h-0.5 bg-white"></span><span class="w-6 h-0.5 bg-white"></span><span class="w-6 h-0.5 bg-white"></span>
    </button>
    <h1 class="kalma text-lg font-extrabold cursor-pointer text-center leading-tight" onclick="go('home')">لا إله إلا الله محمد رسول الله</h1>
    <button onclick="go('fchats')" aria-label="chat" class="relative w-11 h-11 rounded-xl bg-[#175434]/70 hover:bg-[#175434] text-lg">💬<span id="chatDot" class="hidden absolute top-1 right-1 w-3 h-3 rounded-full bg-red-500 border border-white"></span></button>
  </header>

  <!-- HOME (clock + chaughadiya) -->
  <main id="v-home" class="flex-1 px-4 pt-4 pb-8 flex flex-col gap-3">
    <div class="bg-[#0B132B]/85 text-white rounded-3xl p-4 text-center shadow-lg border border-slate-700">
      <svg id="clk" viewBox="0 0 200 200" class="w-52 h-52 mx-auto">
        <circle cx="100" cy="100" r="94" fill="#0F2E1E" stroke="#D4A017" stroke-width="4"/>
        <g id="clkTicks"></g>
        <line id="hH" x1="100" y1="100" x2="100" y2="58" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <line id="hM" x1="100" y1="100" x2="100" y2="36" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <line id="hS" x1="100" y1="112" x2="100" y2="28" stroke="#F5C542" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="5" fill="#F5C542"/>
      </svg>
      <div id="hTime" class="text-4xl font-black tabular-nums mt-1 ltr-lock"></div>
      <div id="hDate" class="text-sm text-slate-200 mt-0.5"></div>
      <div id="hHijri" class="text-xs text-amber-300 mt-0.5"></div>
      <div id="hTz" class="text-[11px] text-slate-400 mt-1 ltr-lock"></div>
    </div>
    <button type="button" onclick="go('salat')" class="text-start bg-[#0B132B]/85 text-white rounded-3xl p-4 border border-slate-700 active:scale-[.99] transition">
      <div class="flex items-center justify-between"><div><div data-t="sNext" class="text-[11px] text-amber-300 font-bold"></div><div id="hSalat" class="text-xl font-black"></div></div><div class="text-3xl">🕌</div></div>
      <div id="hSalatT" class="text-xs text-slate-300 mt-1"></div>
      <div data-t="homeSalat" class="text-[11px] text-emerald-300 mt-1.5 font-bold"></div>
    </button>
    <div class="bg-[#0B132B]/85 text-white rounded-3xl overflow-hidden border border-slate-700">
      <div class="px-4 pt-3 pb-2"><h3 data-t="chTitle" class="font-extrabold text-amber-300"></h3></div>
      <div class="grid grid-cols-2 text-center text-sm font-extrabold">
        <button id="chTabD" onclick="setChTab('day')" data-t="chTabD" class="py-2.5"></button>
        <button id="chTabN" onclick="setChTab('night')" data-t="chTabN" class="py-2.5"></button>
      </div>
      <div id="chList"></div>
      <div id="chFoot" class="text-center text-[13px] font-bold text-slate-300 px-3 py-2.5 border-t border-white/10"></div>
      <div class="grid grid-cols-4 text-center text-[11px] font-bold">
        <div data-t="lgEx" class="py-2 bg-[#16a34a] text-white"></div><div data-t="lgGood" class="py-2 bg-[#3b82f6] text-white"></div><div data-t="lgNorm" class="py-2 bg-[#9ca3af] text-white"></div><div data-t="lgBad" class="py-2 bg-[#b91c1c] text-white"></div>
      </div>
      <div class="px-4 py-2 flex justify-between text-[11px] text-slate-300"><span id="chRise"></span><span id="chSet"></span></div>
      <p id="chNote" class="text-[10px] text-slate-400 pb-3 text-center"></p>
    </div>
    <button onclick="openCredits()" class="w-full flex items-center justify-between px-4 py-3 rounded-2xl bg-[#0B132B]/85 border border-[#D4A017]/60 text-white shadow">
      <span class="font-extrabold text-sm">🪙 <span data-t="credTitle"></span>: <span class="credBal text-[#F5D26B]">–</span></span>
      <span class="px-3 py-1 rounded-lg bg-[#D4A017] text-[#0B132B] text-xs font-black" data-t="credBuy"></span>
    </button>
    <button onclick="go('cast')" data-t="homeEnter" class="w-full py-4 rounded-2xl bg-[#1F6B43] hover:bg-[#175434] text-white font-extrabold shadow-lg"></button>
  </main>

  <!-- CAST -->
  <main id="v-cast" class="hidden flex-1 px-4 pt-4 pb-8 flex flex-col gap-3">
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-200 dark:border-slate-800 space-y-2.5">
      <input id="nameIn" autocomplete="off" data-ph="namePh" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-semibold">
      <input id="qIn" autocomplete="off" data-ph="questionPh" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
    </div>
    <div class="flex items-center justify-between px-1">
      <span data-t="tapHint" class="text-xs font-semibold text-slate-500 dark:text-slate-400"></span>
      <div class="flex gap-1.5">
        <button onclick="resetMothers()" data-t="reset" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800"></button>
        <button onclick="autoCast()" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-[#DCEFE3] dark:bg-[#0F2E1E] text-[#1F6B43] dark:text-[#7FCBA0] border border-[#7FCBA0] dark:border-[#1F6B43]">🎲 <span data-t="auto"></span></button>
      </div>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-200 dark:border-slate-800">
      <div id="mothers" class="grid grid-cols-4 gap-2.5" dir="rtl"></div>
    </div>
    <button onclick="castNow()" data-t="cast" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold uppercase shadow-lg"></button>
    <button onclick="openModal('guideModal')" data-t="guide" class="w-full py-3 rounded-2xl bg-[#1F6B43] text-white font-bold text-sm uppercase"></button>
  </main>

  <!-- RESULTS -->
  <section id="v-results" class="hidden flex-1 bg-[#0B132B]/80 text-white">
    <div class="p-3 space-y-3">
      <div class="bg-[#151E3F] border border-slate-700 rounded-2xl p-3 flex items-center justify-between gap-2">
        <div class="min-w-0"><div data-t="subject" class="text-[11px] uppercase text-[#5DB887] font-bold"></div>
          <div id="rSubject" class="text-sm font-extrabold truncate"></div><div id="rTime" class="text-[11px] text-slate-400"></div></div>
        <div class="flex gap-1.5 shrink-0">
          <button onclick="shareChartImage()" class="p-2.5 rounded-xl bg-slate-800 border border-slate-600">🖼</button>
          <button onclick="copyChart()" class="p-2.5 rounded-xl bg-slate-800 border border-slate-600">📋</button>
          <button onclick="go('cast')" class="p-2.5 rounded-xl bg-indigo-600">↩</button>
        </div>
      </div>
      <div class="ltr-lock space-y-2.5">
        <div><div class="flex justify-between text-[10px] font-bold uppercase text-slate-400 px-1 mb-1"><span data-t="daughters"></span><span data-t="mothersH"></span></div><div id="rowA" class="grid grid-cols-8 gap-1"></div></div>
        <div><div data-t="nieces" class="text-center text-[10px] font-bold uppercase text-slate-400 mb-1"></div><div id="rowB" class="grid grid-cols-4 gap-1.5"></div></div>
        <div><div data-t="witnesses" class="text-center text-[10px] font-bold uppercase text-slate-400 mb-1"></div><div id="rowC" class="grid grid-cols-2 gap-2 max-w-[75%] mx-auto"></div></div>
        <div><div data-t="judge" class="text-center text-[10px] font-bold uppercase text-amber-400 mb-1"></div><div id="rowD" class="max-w-[42%] mx-auto"></div></div>
        <div><div data-t="reconciler" class="text-center text-[10px] font-bold uppercase text-cyan-400 mb-1"></div><div id="rowE" class="max-w-[42%] mx-auto"></div></div>
      </div>
      <div class="text-center space-y-1">
        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#151E3F] border border-slate-700 text-xs font-extrabold"><span data-t="totalDots"></span><span id="rDots" class="text-[#5DB887] text-sm"></span></div>
        <p data-t="tapHouse" class="text-[11px] text-slate-400"></p>
      </div>
      <button onclick="startChat()" class="w-full py-3.5 rounded-xl bg-[#1F6B43] hover:bg-[#175434] text-white font-extrabold text-sm uppercase">💬 <span data-t="interpret"></span> <span class="ms-1 px-2 py-0.5 rounded-full bg-black/25 text-[11px] normal-case">🪙 <span class="costFirst">3</span></span></button>
    </div>
  </section>

  <!-- CHAT -->
  <section id="v-chat" class="hidden flex-1 flex flex-col">
    <div class="flex items-center justify-between px-3 py-2.5 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
      <div class="min-w-0"><div data-t="chatTitle" class="font-extrabold text-sm"></div><div id="cSubject" class="text-[11px] text-[#1F6B43] truncate"></div></div>
      <div class="flex gap-1.5 shrink-0 text-xs font-bold">
        <button onclick="openCredits()" class="px-2.5 py-1.5 rounded-lg bg-[#D4A017]/20 text-[#8a6a05] dark:text-[#F5D26B]">🪙 <span class="credBal">–</span></button>
        <button onclick="saveChat()" class="px-2.5 py-1.5 rounded-lg bg-[#DCEFE3] dark:bg-[#0F2E1E] text-[#1F6B43] dark:text-[#7FCBA0]">💾</button>
        <button onclick="copyChat()" class="px-2.5 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800">📋</button>
        <button onclick="shareChat()" class="px-2.5 py-1.5 rounded-lg bg-[#1F6B43] text-white">WhatsApp</button>
        <button onclick="go('results')" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white">↩</button>
      </div>
    </div>
    <div id="chatLog" class="flex-1 overflow-y-auto p-3 space-y-3" style="min-height:50vh"></div>
    <div class="sticky bottom-0 p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-2">
      <input id="chatIn" data-ph="chatPh" onkeydown="if(event.key==='Enter')sendChat()" class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm">
      <button id="sendBtn" onclick="sendChat()" class="px-4 rounded-xl bg-[#1F6B43] text-white font-bold leading-tight"><span data-t="send"></span><span class="block text-[10px] font-semibold opacity-80">🪙 <span class="costNext">1</span></span></button>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="v-history" class="hidden flex-1 p-4 space-y-3 bg-white/70 dark:bg-slate-950/70">
    <div class="flex items-center justify-between"><h2 data-t="histTitle" class="text-lg font-extrabold"></h2><button onclick="go('cast')" class="px-3 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold" data-t="back"></button></div>
    <input id="histSearch" oninput="renderHistory()" data-ph="histSearch" class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm">
    <div id="histList" class="space-y-2.5"></div>
  </section>

  <!-- DICTIONARY -->
  <section id="v-dict" class="hidden flex-1 p-4 space-y-3 bg-white/70 dark:bg-slate-950/70">
    <div class="flex items-center justify-between"><h2 data-t="dictTitle" class="text-lg font-extrabold"></h2><button onclick="go('cast')" class="px-3 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold" data-t="back"></button></div>
    <div id="dictGrid" class="grid grid-cols-2 gap-3 ltr-lock"></div>
  </section>

  <!-- ADMIN -->
  <section id="v-credits" class="hidden flex-1 p-4 space-y-3 bg-white/70 dark:bg-slate-950/70">
    <div class="flex items-center justify-between"><h2 class="text-lg font-extrabold">🪙 <span data-t="credTitle"></span></h2><button onclick="closeCredits()" class="px-3 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold" data-t="back"></button></div>
    <div class="rounded-3xl p-5 text-center bg-gradient-to-br from-[#0F2E1E] to-[#1F6B43] text-white border border-[#D4A017]/60 shadow">
      <div class="text-xs opacity-80" data-t="credBal"></div>
      <div class="credBal text-5xl font-black text-[#F5D26B] my-1">–</div>
      <div class="text-[11px] opacity-90" id="credCostInfo"></div>
    </div>
    <div id="credMsg" class="hidden rounded-xl p-3 text-sm font-bold text-center"></div>
    <h3 class="font-extrabold text-sm pt-1" data-t="credPkgs"></h3>
    <div id="credPkgs" class="grid gap-2"></div>
    <p class="text-[11px] text-slate-500 text-center" data-t="credSecure"></p>
    <h3 class="font-extrabold text-sm pt-2" data-t="credHist"></h3>
    <div id="credHist" class="space-y-1.5"></div>
  </section>

  <section id="v-admin" class="hidden flex-1 p-3 space-y-3 bg-white/70 dark:bg-slate-950/70">
    <div class="flex items-center justify-between"><h2 class="text-lg font-extrabold">🛡️ <span data-t="navAdmin"></span></h2><button onclick="go('home')" class="px-3 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold" data-t="back"></button></div>
    <div id="aStats" class="grid grid-cols-3 gap-2"></div>
    <div class="grid grid-cols-2 gap-2">
      <button id="aTabR" onclick="setAdminTab('reports')" data-t="adReports" class="py-2.5 rounded-xl text-sm font-bold"></button>
      <button id="aTabU" onclick="setAdminTab('users')" data-t="adUsers" class="py-2.5 rounded-xl text-sm font-bold"></button>
    </div>
    <input id="aSearch" oninput="renderAdmin()" data-ph="adSearch" class="hidden w-full px-4 py-2.5 rounded-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm">
    <div id="aBody" class="space-y-2"></div>
  </section>

  <!-- SALAT -->
  <section id="v-salat" class="hidden flex-1 p-4 space-y-3 bg-white/70 dark:bg-slate-950/70">
    <div class="flex items-center justify-between"><h2 data-t="sTitle" class="text-lg font-extrabold"></h2><button onclick="go('home')" class="px-3 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold" data-t="back"></button></div>
    <div id="sNextBox" class="rounded-3xl p-4 text-center text-white bg-[#1F6B43] shadow-lg"></div>
    <div id="sList" class="space-y-1.5"></div>
    <div class="grid grid-cols-2 gap-2">
      <select id="sMethod" onchange="setPrayOpts()" class="px-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs font-bold"><option value="MWL">Muslim World League</option><option value="Egypt">Egyptian</option><option value="Karachi">Karachi</option><option value="ISNA">ISNA</option><option value="Makkah">Umm al-Qura</option></select>
      <select id="sAsr" onchange="setPrayOpts()" class="px-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs font-bold"><option value="1" data-t="sAsrStd"></option><option value="2" data-t="sAsrHan"></option></select>
    </div>
    <button id="sRemindBtn" onclick="toggleRemind()" class="w-full py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm font-bold flex items-center justify-between px-4"><span>🔔 <span data-t="sRemind"></span></span><span id="sRemindTag" class="text-xs px-2.5 py-1 rounded-full bg-slate-200 dark:bg-slate-800"></span></button>
    <div class="bg-[#0B132B]/85 text-white rounded-3xl p-4 text-center border border-slate-700">
      <h3 data-t="sQibla" class="font-extrabold text-amber-300 mb-1"></h3>
      <svg viewBox="0 0 200 200" class="w-52 h-52 mx-auto">
        <polygon points="100,2 93,17 107,17" fill="#F5C542"/>
        <g id="cmp">
          <circle cx="100" cy="100" r="84" fill="#0F2E1E" stroke="#D4A017" stroke-width="3"/>
          <g font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><text x="100" y="32">N</text><text x="171" y="105">E</text><text x="100" y="178">S</text><text x="29" y="105">W</text></g>
          <g id="qArrow"><line x1="100" y1="100" x2="100" y2="58" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/><text x="100" y="56" text-anchor="middle" font-size="22">🕋</text></g>
          <circle cx="100" cy="100" r="5" fill="#F5C542"/>
        </g>
      </svg>
      <div id="qText" class="text-sm font-bold ltr-lock"></div>
      <p data-t="sQiblaHint" class="text-[11px] text-slate-300 mt-1"></p>
      <button onclick="startCompass()" data-t="sCompass" class="mt-2 px-4 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold"></button>
    </div>
    <p data-t="sNote" class="text-[11px] text-slate-500 dark:text-slate-400 text-center"></p>
  </section>

  <!-- FRIENDS LIST -->
  <section id="v-fchats" class="hidden flex-1 p-3 space-y-2.5 bg-white/70 dark:bg-slate-950/70">
    <div class="flex items-center justify-between"><h2 data-t="fcTitle" class="text-lg font-extrabold"></h2><button onclick="go('cast')" class="px-3 py-2 rounded-xl bg-[#1F6B43] text-white text-xs font-bold" data-t="back"></button></div>

    <div id="fList" class="space-y-1.5"></div>
  </section>

  <!-- FRIENDS CONVERSATION -->
  <section id="v-fchat" class="hidden flex-1 flex flex-col">
    <div class="flex items-center gap-2 px-3 py-2.5 bg-[#1F6B43] text-white">
      <button onclick="go('fchats')" class="w-9 h-9 rounded-full hover:bg-[#175434] text-lg">←</button>
      <div id="fAv" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-black shrink-0 overflow-hidden"></div>
      <div class="min-w-0"><div id="fName" class="font-extrabold text-sm truncate"></div><div id="fSub" class="text-[11px] text-green-100 truncate"></div></div>
      <button id="fBlockBtn" onclick="blockUser(openPeer)" data-t="fcBlock" class="ms-auto px-2.5 py-1.5 rounded-lg bg-white/15 text-xs font-bold"></button>
    </div>
    <div id="fLog" class="flex-1 overflow-y-auto p-3 space-y-1.5 bg-white/60 dark:bg-slate-950/60" style="min-height:55vh"></div>

  for (let r = 0; r < 4; r++) H[5 + r] = { n: 5 + r, p: [H[1].p[r], H[2].p[r], H[3].p[r], H[4].p[r]], from: { type: 'row', row: r + 1 } };
  [[9,1,2],[10,3,4],[11,5,6],[12,7,8],[13,9,10],[14,11,12],[15,13,14],[16,15,1]].forEach(([n, a, b]) => { H[n] = { n, p: combine(H[a].p, H[b].p), from: { type: 'sum', a, b } }; });

}
const TIME_OF = h => [1,4,7,10].includes(h) ? 'HAL/present' : [2,5,8,11].includes(h) ? 'MUSTAQBAL/future' : [3,6,9,12].includes(h) ? 'MADI/past' : 'ZAWA\'ID (partner of ' + ({13:1,14:4,15:7,16:10}[h]) + ')';
// Natural housing (التسكين الطبيعي, book p.44): figure -> its natural house 1..16 (verified against the book's examples: Ahyan=2, Judula=11, Humra/Nusra-Dakhila 7 apart)
const NATURAL = ['2122','1222','1112','1211','2111','1212','2211','2221','1122','2121','1121','2212','1221','1111','2112','2222'];
// Planet of each figure (تسكين الكواكب, book p.44) and its exaltation/fall houses (book p.66)
const PLANET = { Saturn: ['2221','1221'], Jupiter: ['1222','2111'], Mars: ['2122','1121'], Sun: ['1122','2121'], Venus: ['2211','1211'], Mercury: ['2222','2112'], Moon: ['2212','1111'], Ras: ['1212'], Dhanab: ['1112'] };
const DIGNITY = { Saturn: [7,1], Jupiter: [4,12], Mars: [2,8], Sun: [1,7], Venus: [12,4], Mercury: [6,12], Moon: [2,8], Ras: [2,8], Dhanab: [2,8] };
const MOVE_MEANING = { 1: 'in its own natural house (no movement)', 5: 'moved to its 5th: RAQIB and FARAH (joy)', 6: 'moved to its 6th: NAHS (misfortune)', 7: 'moved to its 7th: MATLUB (the sought thing)', 8: 'moved to its 8th: IHTIRAQ and WABAL (burning, ruin)', 9: 'moved to its 9th: GHAYB (absent/hidden)', 10: 'moved to its 10th: IZZ and MULK (honour, rule)', 12: 'moved to its 12th: ADAWA and DIDD (enmity, opposition)' };
const planetOf = k => Object.keys(PLANET).find(pl => PLANET[pl].includes(k));
function tafiyaOf(h) {                                         // where the same figure also appears (tikrar)
  const key = chart.H[h].p.join(''), at = [];
  for (let k = 1; k <= 16; k++) if (k !== h && chart.H[k].p.join('') === key) at.push(k);
  return at;
}
function moveOf(h) {                                           // tafiya: how many houses the figure moved from its natural house (counted over the 16 houses, as the book does)
  const key = chart.H[h].p.join(''), nat = NATURAL.indexOf(key) + 1, rel = ((h - nat + 16) % 16) + 1, pl = planetOf(key), d = pl && DIGNITY[pl];
  return { nat, rel, planet: pl, meaning: MOVE_MEANING[rel] || 'moved to its ' + rel + 'th: no special rule applies for this distance', sharaf: !!(d && d[0] === h), hubut: !!(d && d[1] === h) };
}
function chartSummary() {
  const lines = [`${t('subject')}: ${chart.name}`, chart.question ? `Question: ${chart.question}` : '',
    'For every house: the figure, its time (HAL=present, MUSTAQBAL=future, MADI=past), its natural house, its TAFIYA (how far it moved from its natural house) with its meaning, its planet, and repeats.'];
  for (let i = 1; i <= 16; i++) {
    const f = figOf(chart.H[i].p), at = tafiyaOf(i), m = moveOf(i);
    lines.push(`House ${i} (${catOf(i)}) [time: ${TIME_OF(i)}]: ${f.ha} / ${f.en} / ${f.ar} [${chart.H[i].p.join('')}] | natural house ${m.nat} | TAFIYA ${m.rel}: ${m.meaning} | planet ${m.planet || '?'}` + (m.sharaf ? ' | in its SHARAF (exaltation)' : '') + (m.hubut ? ' | in its HUBUT (fall)' : '') + (at.length ? ` | SAME FIGURE ALSO IN HOUSES ${at.join(', ')}` : ''));
  }
  const names = { 1: 'Dali\'i / the Querent (house 1)', 7: 'Madlub / the Sought (house 7)', 10: 'house 10', 4: 'house 4', 15: 'Judge/Witness (house 15)', 16: 'Reconciler (house 16)' };

  return lines.filter(x => x !== undefined && x !== null).join('\n');
}

const AR_NORM = s => String(s).replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/[^ء-ي\s]/g, ' ');
const arTok = s => AR_NORM(s).split(/\s+/).map(w => (w.length > 3 && w.startsWith('ال')) ? w.slice(2) : w).filter(w => w.length >= 3);
let BIDX = null;
function buildIdx() {
  if (BIDX) return BIDX; const df = {}; BIDX = { tf: [], df, N: window.BOOK.chunks.length };
  window.BOOK.chunks.forEach(c => { const m = {}, tt = {}; arTok(c.t + ' ' + c.x).forEach(w => m[w] = (m[w] || 0) + 1); arTok(c.t).forEach(w => tt[w] = 1); BIDX.tf.push({ m, tt }); Object.keys(m).forEach(w => df[w] = (df[w] || 0) + 1); });
  return BIDX;
}
function localSearch(tokens, n) {
  const I = buildIdx(), sc = [], seen = new Set(tokens);
  window.BOOK.chunks.forEach((c, i) => { let s = 0; const { m, tt } = I.tf[i];
    seen.forEach(w => { if (m[w]) s += (1 + Math.log(m[w])) * Math.log(1 + I.N / (I.df[w] || 1)); if (tt[w]) s += 6; });
    if (s > 0) sc.push([s, i]); });
  sc.sort((a, b) => b[0] - a[0]); return sc.slice(0, n).map(x => x[1]);
}

async function planBook(q) {                                   // 1st (small) AI call: pick chapters from the table of contents
  const toc = window.BOOK.chunks.map(c => c.i + '|' + c.t).join('\n');
  const prompt = `You choose which parts of the Arabic book «الفلك المشحون في علم الرمل المصون» are needed to answer a question about a geomancy (Raml) chart.\nUSER QUESTION (any language): ${q}\n\nCHART:\n${chartSummary()}\n\nBOOK TABLE OF CONTENTS (id|title):\n${toc}\n\nReturn ONLY JSON: {"chunks":[up to 8 ids from the table of contents most useful to answer THIS question, the best topic chapters first],"houses":[up to 3 house numbers 1-16 that rule the question topic],"keywords":[up to 8 Arabic keywords exactly as they would appear in the book]}`;

async function buildBookCtx(userText) {
  if (!bookReady() || !chart) return null;
  const B = window.BOOK.chunks, pr = new Map(); let used = 0; const CAP = 105000;
  const q = [chart.question, userText].filter((x, i, a) => x && a.indexOf(x) === i).join(' | ');
  let plan = null; try { plan = await planBook(q); } catch (e) {}
  const hits = TOPICS.filter(tp => tp.k.test(q));
  const houses = new Set(((plan && plan.houses) || []).map(Number).filter(h => h >= 1 && h <= 16)); hits.forEach(tp => tp.h && houses.add(tp.h));
  const ids = [];                                              // priority order: core → planner → keyword → figure sections
  const add = (id, why) => { id = Number(id); if (!isFinite(id) || !B[id] || pr.has(id)) return; pr.set(id, why); ids.push(id); };
  window.BOOK.core.forEach(id => add(id, 'core'));
  ((plan && plan.chunks) || []).slice(0, 14).forEach(id => add(id, 'plan'));
  const kw = [...((plan && plan.keywords) || []), ...hits.map(tp => tp.ar), /[؀-ۿ]/.test(q) ? q : ''].join(' ');
  localSearch(arTok(kw), plan ? 6 : 10).forEach(id => add(id, 'kw'));
  const keyH = new Set([1, 15, 16, 13, 14]); houses.forEach(h => keyH.add(h));
  const figs = new Set(); keyH.forEach(h => { if (chart.H[h]) figs.add(chart.H[h].p.join('')); });
  B.forEach(c => { if (c.f && figs.has(c.f)) add(c.i, 'fig'); });
  const keep = []; ids.forEach(id => { const len = B[id].x.length + 120; if (used + len <= CAP) { keep.push(id); used += len; } });
  keep.sort((a, b) => a - b);
  const text = keep.map(id => { const c = B[id], fg = c.f && FIG[c.f] ? ` | هذا الشكل في تخت المستفتي يسمى: ${FIG[c.f].ar} [${c.f}]` : ''; return `[#${id} | ${c.t} | ص ${c.p}${fg}]\n${c.x}`; }).join('\n\n');
  const sources = keep.filter(id => pr.get(id) === 'plan' || pr.get(id) === 'kw').slice(0, 4).map(id => B[id].t.replace(/\s*\(جزء.*\)$/, '') + ' (ص ' + B[id].p + ')');
  return { text, sources: [...new Set(sources)], planned: !!plan };
}

    g.fillStyle = '#94a3b8'; g.font = 'bold ' + (big ? 24 : 18) + 'px system-ui, sans-serif'; g.textAlign = 'left'; g.fillText(h.n, x + 12, yy + (big ? 32 : 26)); g.textAlign = 'center';
    const r = big ? 11 : 8, gap = big ? 50 : 40, top = yy + (big ? 62 : 58); g.fillStyle = '#fff';
    h.p.forEach((v, i) => { const cy = top + i * gap; if (v === 1) { g.beginPath(); g.arc(x + w / 2, cy, r, 0, 7); g.fill(); } else { [-1, 1].forEach(sg => { g.beginPath(); g.arc(x + w / 2 + sg * r * 1.9, cy, r, 0, 7); g.fill(); }); } });
    g.fillStyle = '#fff'; g.font = 'bold ' + (big ? 28 : 17) + 'px system-ui, sans-serif'; g.fillText(fname(f), x + w / 2, yy + hh - (big ? 46 : 34), w - 8);
    g.fillStyle = '#94a3b8'; g.font = (big ? 22 : 15) + "px Amiri, 'Traditional Arabic', serif"; g.fillText(f.ar, x + w / 2, yy + hh - (big ? 16 : 12), w - 8);
  };
  const Hh = chart.H, m = 40, label = (txt, yy, col) => { g.fillStyle = col || '#94a3b8'; g.font = 'bold 22px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText(txt, W / 2, yy); };
  label(t('daughters') + '   |   ' + t('mothersH'), y); y += 14;
  const w8 = (W - 2 * m - 7 * 8) / 8; [8, 7, 6, 5, 4, 3, 2, 1].forEach((n, i) => card(Hh[n], m + i * (w8 + 8), y, w8, 280, false)); y += 280 + 44;
  label(t('nieces'), y - 12); const w4 = (W - 2 * m - 3 * 16) / 4; [12, 11, 10, 9].forEach((n, i) => card(Hh[n], m + i * (w4 + 16), y, w4, 300, true)); y += 300 + 44;
  const w2 = 250, x2 = (W - 2 * w2 - 24) / 2;
  label(t('witnesses'), y - 12); [14, 13].forEach((n, i) => card(Hh[n], x2 + i * (w2 + 24), y, w2, 300, true)); y += 300 + 44;
  const lab2 = (txt, cx, yy, col) => { g.fillStyle = col; g.font = 'bold 22px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText(txt, cx, yy); };
  lab2(t('judge'), x2 + w2 / 2, y - 12, '#fbbf24'); lab2(t('reconciler'), x2 + w2 + 24 + w2 / 2, y - 12, '#22d3ee');
  card(Hh[15], x2, y, w2, 300, true); card(Hh[16], x2 + w2 + 24, y, w2, 300, true);
  g.fillStyle = '#4ade80'; g.font = 'bold 28px system-ui, sans-serif'; g.fillText(t('totalDots') + ' ' + chart.dots, W / 2, H - 30);
  return cv;
}
function shareChartImage() {
  if (!chart) return;
  drawChartCanvas().toBlob(async b => {
    if (!b) return; const f = new File([b], 'ramli.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: chart.name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ramli-' + Date.now() + '.png'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast(t('imgSaved'));
  }, 'image/png');
}

// ================= ADMIN PANEL =================
let adminTab = 'reports', adm = { reports: [], msgs: {}, bans: new Set(), stats: null, err: false, wallets: {}, rev: null, users: {}, usersOk: false };
async function failToast(def) {
  try { const { data } = await sb.from('bans').select('user_id').eq('user_id', ME.id).maybeSingle(); if (data) return toast(t('fcBanned')); } catch (e) {}
  toast(def);
}
async function checkAdmin() {
  const { data, error } = await sb.from('admins').select('user_id').eq('user_id', ME.id).maybeSingle();
  ME.isAdmin = !error && !!data; $('navAdmin').classList.toggle('hidden', !ME.isAdmin);
}
function setAdminTab(x) { adminTab = x; renderAdmin(); }
async function loadAdmin() {
  if (!ME || !ME.isAdmin) { go('home'); return; }
  renderAdmin();
  const st = await sb.rpc('admin_stats'); adm.err = !!st.error; adm.stats = st.data || null;
  const rp = await sb.from('reports').select('*').order('created_at', { ascending: false }).limit(200); adm.reports = rp.data || [];
  const ids = adm.reports.map(r => r.message_id).filter(x => x != null); adm.msgs = {};
  if (ids.length) { const ms = await sb.from('messages').select('*').in('id', ids); (ms.data || []).forEach(m => adm.msgs[m.id] = m); }
  const bn = await sb.from('bans').select('user_id'); adm.bans = new Set((bn.data || []).map(x => x.user_id));
  const wl = await sb.rpc('admin_wallets'); adm.wallets = {}; (wl.data || []).forEach(w => adm.wallets[w.user_id] = w.balance);
  const rv = await sb.rpc('admin_revenue'); adm.rev = rv.error ? null : rv.data;
  const au = await sb.rpc('admin_users'); adm.users = {}; adm.usersOk = !au.error; (au.data || []).forEach(u => adm.users[u.id] = u);
  await loadProfiles(); if (view === 'admin') renderAdmin();
}
function renderAdmin() {
  const R = adminTab === 'reports';
  $('aTabR').className = 'py-2.5 rounded-xl text-sm font-bold ' + (R ? 'bg-[#1F6B43] text-white' : 'bg-slate-200 dark:bg-slate-800');
  $('aTabU').className = 'py-2.5 rounded-xl text-sm font-bold ' + (!R ? 'bg-[#1F6B43] text-white' : 'bg-slate-200 dark:bg-slate-800');
  $('aSearch').classList.toggle('hidden', R);
  const S = adm.stats, box = (n, l) => `<div class="rounded-2xl p-2.5 text-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><div class="text-xl font-black text-[#1F6B43] dark:text-[#7FCBA0]">${n == null ? '–' : n}</div><div class="text-[10px] font-bold text-slate-500">${l}</div></div>`;
  $('aStats').innerHTML = box(S && S.users, t('adStUsers')) + box(S && S.messages, t('adStMsgs')) + box(S && S.voice, t('adStVoice')) + box(S && S.open_reports, t('adStOpen')) + box(S && S.bans, t('adStBans')) + box(adm.rev ? Number(adm.rev.total_ngn).toLocaleString('en-US') : null, t('adStRev'));
  if (adm.err) { $('aBody').innerHTML = `<p class="text-center text-sm text-slate-600 dark:text-slate-300 py-4">${t('adSetup')}</p>`; return; }
  const bt = 'px-2.5 py-1.5 rounded-lg text-xs font-bold ', btn = (c, fn, txt) => `<button onclick="${fn}" class="${bt}${c}">${txt}</button>`;
  if (R) {
    const list = adm.reports.slice().sort((a, b) => (a.resolved - b.resolved) || (new Date(b.created_at) - new Date(a.created_at)));
    $('aBody').innerHTML = list.length ? list.map(r => {
      const m = adm.msgs[r.message_id], isB = adm.bans.has(r.reported_id);
      const content = m ? (m.kind === 'voice' ? t('fcVoice') : esc(m.body)) : `<i class="opacity-60">${t('adGone')}</i>`;
      return `<div class="rounded-2xl p-3 bg-white dark:bg-slate-900 border ${r.resolved ? 'border-slate-200 dark:border-slate-800 opacity-60' : 'border-rose-300 dark:border-rose-900'}">
        <div class="flex justify-between gap-2 text-[11px] text-slate-500"><span>${t('adFrom')}: <b>${esc(nameOf(r.reporter_id))}</b></span><span>${new Date(r.created_at).toLocaleString(locale())}</span></div>
        <div class="text-sm font-extrabold mt-0.5">${t('adAbout')}: ${esc(nameOf(r.reported_id))}${isB ? ' 🚫' : ''}</div>
        <div class="text-sm my-1.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-800 break-words">${content}</div>
        ${r.reason ? `<div class="text-xs text-slate-600 dark:text-slate-300 mb-1.5">“${esc(r.reason)}”</div>` : ''}
        <div class="flex flex-wrap gap-1.5">
          ${m ? btn('bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300', `adminDelMsg(${m.id})`, '🗑 ' + t('adDelMsg')) : ''}
          ${r.reported_id ? (isB ? btn('bg-slate-200 dark:bg-slate-800', `adminUnban('${r.reported_id}')`, '✅ ' + t('adUnban')) : btn('bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300', `adminBan('${r.reported_id}')`, '🚫 ' + t('adBan'))) : ''}
          ${r.resolved ? '' : btn('bg-[#1F6B43] text-white', `adminResolve(${r.id})`, '✔ ' + t('adResolve'))}
        </div></div>`; }).join('') : `<p class="text-center text-sm text-slate-500 py-6">${t('adNone')}</p>`;
  } else {
    const q = ($('aSearch').value || '').trim().toLowerCase();
    const all = {}; Object.values(profiles).forEach(p => all[p.id] = p); Object.values(adm.users || {}).forEach(u => { if (!all[u.id]) all[u.id] = { id: u.id, username: (u.email || '').split('@')[0] }; });
    const em = id => (adm.users && adm.users[id] && adm.users[id].email) || '';
    const us = Object.values(all).filter(p => p.id !== ME.id && (!q || (p.username || '').toLowerCase().includes(q) || em(p.id).toLowerCase().includes(q))).sort((a, b) => ((adm.users[b.id] && adm.users[b.id].created_at) || '').localeCompare((adm.users[a.id] && adm.users[a.id].created_at) || '') || (a.username || '').localeCompare(b.username || ''));
    $('aBody').innerHTML = us.length ? us.map(p => { const isB = adm.bans.has(p.id);
      return `<div class="rounded-2xl p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><div class="flex items-center gap-2.5">${avatarHtml(p.id, p.username, 'w-10 h-10')}<div class="min-w-0 flex-1"><div class="font-extrabold text-sm truncate">${esc(p.username)}</div>${em(p.id) ? `<div class="text-[11px] text-slate-500 truncate select-all">✉️ ${esc(em(p.id))}</div>` : ''}${adm.users && adm.users[p.id] ? `<div class="text-[10px] text-slate-400">${new Date(adm.users[p.id].created_at).toLocaleDateString(locale())}</div>` : ''}${isB ? `<div class="text-[11px] font-bold text-rose-600">🚫 ${t('adBanned')}</div>` : ''}</div><div class="px-2 py-1 rounded-lg bg-[#D4A017]/20 text-[#8a6a05] dark:text-[#F5D26B] text-xs font-black">🪙 ${adm.wallets[p.id] == null ? 0 : adm.wallets[p.id]}</div></div>
        <div class="flex flex-wrap gap-1.5 mt-2">${isB ? btn('bg-slate-200 dark:bg-slate-800', `adminUnban('${p.id}')`, '✅ ' + t('adUnban')) : btn('bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300', `adminBan('${p.id}')`, '🚫 ' + t('adBan'))}${btn('bg-[#D4A017]/20 text-[#8a6a05] dark:text-[#F5D26B]', `adminGrant('${p.id}')`, '🪙 ' + t('adGrant'))}${btn('bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300', `adminPurge('${p.id}')`, '🗑 ' + t('adPurge'))}</div></div>`; }).join('') : `<p class="text-center text-sm text-slate-500 py-6">${t('adNone')}</p>`;
  }
}
async function adminGrant(uid) {
  const v = prompt(t('adGrantAsk'), '10'); if (v == null) return;
  const n = parseInt(v, 10); if (!n) return;
  const r = await sb.rpc('admin_grant_credits', { target: uid, amount: n, note: 'admin' });
  if (r.error) return toast(r.error.message);
  adm.wallets[uid] = r.data; toast(t('adGranted')); renderAdmin();
}
async function adminBan(uid) {
  if (!confirm(t('adBanQ'))) return; const reason = (prompt(t('adReasonQ')) || '').slice(0, 200);
  const { error } = await sb.from('bans').insert({ user_id: uid, reason }); if (error && !/duplicate|already/i.test(error.message)) return toast(error.message);
  await sb.rpc('admin_set_disabled', { target: uid, disabled: true });
  adm.bans.add(uid); renderAdmin(); toast(t('adDone'));
}
async function adminUnban(uid) { const { error } = await sb.from('bans').delete().eq('user_id', uid); if (error) return toast(error.message); await sb.rpc('admin_set_disabled', { target: uid, disabled: false }); adm.bans.delete(uid); renderAdmin(); toast(t('adDone')); }
async function adminDelMsg(id) {
  if (!confirm(t('delQ'))) return; const m = adm.msgs[id];
  const { error } = await sb.from('messages').delete().eq('id', id); if (error) return toast(error.message);
  if (m && m.media_path) sb.storage.from('voice').remove([m.media_path]);
  delete adm.msgs[id]; fmsgs.delete(id); renderAdmin(); toast(t('adDone'));
}
async function adminResolve(id) {
  const { error } = await sb.from('reports').update({ resolved: true }).eq('id', id); if (error) return toast(error.message);
  const r = adm.reports.find(x => x.id === id); if (r) r.resolved = true; if (adm.stats) adm.stats.open_reports = Math.max(0, (adm.stats.open_reports || 1) - 1); renderAdmin();
}
async function adminPurge(uid) {
  if (!confirm(t('adPurgeQ'))) return;
  const { error } = await sb.from('messages').delete().eq('sender_id', uid).is('receiver_id', null); if (error) return toast(error.message);
  [...fmsgs.values()].forEach(m => { if (m.sender_id === uid && m.receiver_id == null) fmsgs.delete(m.id); }); toast(t('adDone'));
}
